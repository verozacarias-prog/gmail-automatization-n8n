<svg width="700" height="690" viewBox="0 0 700 690" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Arial, sans-serif">
  <title>Sub-workflow: Classify Mail — Email Organization v2</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- N1: Input (gray) -->
  <rect x="200" y="20" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="350" y="39" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Input from main workflow</text>
  <text x="350" y="58" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">mail batch + history_data (filtered by sender)</text>

  <line x1="350" y1="76" x2="350" y2="104" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- N2: Size Filter (gray) -->
  <rect x="260" y="106" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="350" y="128" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Size Filter</text>

  <!-- Branch: too big -->
  <rect x="40" y="106" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="120" y="128" font-size="13" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Mail too big</text>
  <line x1="260" y1="128" x2="200" y2="128" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="230" y="122" font-size="11" fill="#888780" text-anchor="middle">too large</text>

  <line x1="350" y1="150" x2="350" y2="178" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- N3: Is WhiteList? (gray) -->
  <rect x="245" y="180" width="210" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="350" y="202" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">It is WhiteList?</text>

  <!-- Branch: FAMILY -->
  <rect x="40" y="180" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="115" y="202" font-size="13" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Mark FAMILY</text>
  <line x1="245" y1="202" x2="190" y2="202" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="217" y="196" font-size="11" fill="#888780" text-anchor="middle">yes</text>

  <line x1="350" y1="224" x2="350" y2="252" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="362" y="238" font-size="11" fill="#888780" dominant-baseline="central">no</text>

  <!-- N4: Get msg + Clean HTML (gray) -->
  <rect x="168" y="254" width="364" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="350" y="276" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Get message details → Clean HTML body</text>

  <line x1="350" y1="298" x2="350" y2="326" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- N5: Get IA request (amber — KEY CHANGE) -->
  <rect x="143" y="328" width="414" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="350" y="347" font-size="14" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">Get IA request</text>
  <text x="350" y="366" font-size="12" fill="#633806" text-anchor="middle" dominant-baseline="central">★ reads $json.history_data — no Sheets re-fetch</text>

  <line x1="350" y1="384" x2="350" y2="412" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- N6: AI Clasificador (purple) -->
  <rect x="213" y="414" width="274" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="350" y="436" font-size="14" font-weight="600" fill="#26215C" text-anchor="middle" dominant-baseline="central">AI Clasificador de Mails</text>

  <line x1="350" y1="458" x2="350" y2="486" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- N7: If needs PDF? (gray) -->
  <rect x="233" y="488" width="234" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="350" y="510" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">If needs PDF?</text>

  <!-- Branch true: Add Pending -->
  <rect x="40" y="566" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="115" y="588" font-size="13" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Add Pending</text>
  <path d="M 233 510 L 115 510 L 115 566" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="174" y="504" font-size="11" fill="#888780" text-anchor="middle">true</text>

  <!-- Branch false: Call Acciones -->
  <rect x="455" y="566" width="205" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="558" y="582" font-size="12" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Call Acciones Gmail</text>
  <text x="558" y="598" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">&amp; update Memory</text>
  <path d="M 467 510 L 558 510 L 558 566" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="512" y="504" font-size="11" fill="#888780" text-anchor="middle">false</text>

  <!-- Return labels -->
  <text x="115" y="628" font-size="11" fill="#B4B2A9" text-anchor="middle">→ returns { needs_pdf: true }</text>
  <text x="558" y="628" font-size="11" fill="#B4B2A9" text-anchor="middle">→ returns { categoria, acción }</text>

  <!-- Title -->
  <text x="350" y="665" font-size="11" fill="#B4B2A9" text-anchor="middle">Sub-workflow: Classify Mail — history comes as parameter, no Sheets re-fetch inside sub-workflow</text>
</svg>

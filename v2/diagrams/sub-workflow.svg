<svg width="700" height="720" viewBox="0 0 700 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Arial, sans-serif">
  <title>Sub-workflow: Classify Mail — Email Organization v2</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- N1: Input -->
  <rect x="175" y="20" width="350" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="350" y="39" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Input — one mail per execution</text>
  <text x="350" y="58" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">mail + history_data + isWhitelisted (injected by main)</text>

  <line x1="350" y1="76" x2="350" y2="104" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- N2: Size Filter -->
  <rect x="260" y="106" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="350" y="128" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Size Filter</text>

  <!-- Branch too big -->
  <rect x="30" y="106" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="115" y="122" font-size="12" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">SET MAIL TOO BIG</text>
  <text x="115" y="138" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">categoria: AMBIGUO</text>
  <line x1="260" y1="128" x2="200" y2="128" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="230" y="122" font-size="11" fill="#888780" text-anchor="middle">&gt;500KB</text>

  <!-- Too big chain -->
  <line x1="115" y1="150" x2="115" y2="178" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="30" y="180" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="115" y="196" font-size="12" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Call Acciones Gmail</text>
  <text x="115" y="210" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">(apply AMBIGUO label)</text>
  <line x1="115" y1="224" x2="115" y2="252" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="30" y="254" width="170" height="36" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="115" y="272" font-size="12" font-weight="600" fill="#1B5E20" text-anchor="middle" dominant-baseline="central">Return Too Big</text>

  <line x1="350" y1="150" x2="350" y2="178" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- N3: WhiteList -->
  <rect x="245" y="180" width="210" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="350" y="202" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">It is WhiteList?</text>

  <!-- Branch family -->
  <line x1="350" y1="224" x2="350" y2="252" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="362" y="238" font-size="11" fill="#888780" dominant-baseline="central">no</text>

  <!-- Whitelist true path — goes right -->
  <rect x="490" y="180" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="575" y="196" font-size="12" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Mark FAMILY/</text>
  <text x="575" y="210" font-size="12" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">IMPORTANTE</text>
  <line x1="455" y1="202" x2="490" y2="202" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="472" y="196" font-size="11" fill="#888780" text-anchor="middle">yes</text>
  <line x1="575" y1="224" x2="575" y2="252" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="490" y="254" width="170" height="36" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="575" y="272" font-size="12" font-weight="600" fill="#1B5E20" text-anchor="middle" dominant-baseline="central">Return Family</text>

  <!-- N4: Get msg + Clean -->
  <rect x="168" y="254" width="270" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="303" y="276" font-size="13" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Get message details → Clean HTML</text>

  <line x1="303" y1="298" x2="303" y2="326" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- N5: Get IA request (amber) -->
  <rect x="143" y="328" width="320" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="303" y="347" font-size="14" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">Get IA request</text>
  <text x="303" y="366" font-size="12" fill="#633806" text-anchor="middle" dominant-baseline="central">★ reads $json.history_data — no Sheets call</text>

  <!-- fan-out arrows -->
  <line x1="303" y1="384" x2="250" y2="412" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="303" y1="384" x2="356" y2="412" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="220" y="398" font-size="10" fill="#888780">→ AI</text>
  <text x="340" y="398" font-size="10" fill="#888780">→ Merge in1</text>

  <!-- N6: AI Clasificador -->
  <rect x="168" y="414" width="164" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="250" y="436" font-size="13" font-weight="600" fill="#26215C" text-anchor="middle" dominant-baseline="central">AI Clasificador</text>

  <!-- N7: Merge -->
  <rect x="340" y="414" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="400" y="430" font-size="12" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Merge AI /</text>
  <text x="400" y="446" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">mail info</text>

  <line x1="250" y1="458" x2="370" y2="458" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="400" y1="458" x2="400" y2="486" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- N8: If needs pdf? -->
  <rect x="285" y="488" width="230" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="400" y="510" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">If needs PDF?</text>

  <!-- Branch true: Add Pending -->
  <path d="M 285 510 L 168 510 L 168 556" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="226" y="504" font-size="11" fill="#888780" text-anchor="middle">true</text>
  <rect x="83" y="558" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="168" y="574" font-size="12" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Add Pending</text>
  <text x="168" y="590" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">(Sheets append)</text>
  <line x1="168" y1="602" x2="168" y2="630" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="83" y="632" width="170" height="36" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="168" y="650" font-size="12" font-weight="600" fill="#1B5E20" text-anchor="middle" dominant-baseline="central">Return Pending</text>

  <!-- Branch false: Call Acciones -->
  <path d="M 515 510 L 590 510 L 590 556" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <text x="552" y="504" font-size="11" fill="#888780" text-anchor="middle">false</text>
  <rect x="505" y="558" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="590" y="574" font-size="12" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Call Acciones Gmail</text>
  <text x="590" y="590" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">&amp; update Memory</text>
  <line x1="590" y1="602" x2="590" y2="630" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="505" y="632" width="170" height="36" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="590" y="650" font-size="12" font-weight="600" fill="#1B5E20" text-anchor="middle" dominant-baseline="central">Return Classified</text>

  <!-- Legend -->
  <rect x="30" y="688" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="50" y="695" font-size="11" fill="#5F5E5A" dominant-baseline="central">flow control</text>
  <rect x="175" y="688" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="195" y="695" font-size="11" fill="#633806" dominant-baseline="central">no Sheets re-fetch</text>
  <rect x="340" y="688" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="360" y="695" font-size="11" fill="#3C3489" dominant-baseline="central">AI classification</text>
  <rect x="490" y="688" width="14" height="14" rx="3" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="510" y="695" font-size="11" fill="#1B5E20" dominant-baseline="central">independent returns</text>

  <!-- Title -->
  <text x="350" y="712" font-size="11" fill="#B4B2A9" text-anchor="middle">Sub-workflow: Classify Mail — one execution per mail, no final merge</text>
</svg>
